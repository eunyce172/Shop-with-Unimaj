<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop with Unimaj</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff8f5;--ink:#3a1230;--mut:#7a5a72;--card:#fff;--pink:#f6cfdd;--gold:#c79a2e;--line:#ecd9e0;--btn:#3a1230;--btnt:#fff8f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0b19;--ink:#fbe9f0;--mut:#c4a2b6;--card:#2a1425;--pink:#4a2142;--gold:#e0b84f;--line:#4a2a42;--btn:#f6cfdd;--btnt:#3a1230}}
:root[data-theme="dark"]{--bg:#1d0b19;--ink:#fbe9f0;--mut:#c4a2b6;--card:#2a1425;--pink:#4a2142;--gold:#e0b84f;--line:#4a2a42;--btn:#f6cfdd;--btnt:#3a1230}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
.logo{font:800 1.3rem Fraunces,serif;text-decoration:none;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 11px;border-radius:99px;text-decoration:none;font-weight:500}
nav a:hover{background:var(--pink)}
nav a.on{background:var(--btn);color:var(--btnt)}
.cartb,.menub{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 12px;cursor:pointer;font:inherit;display:flex;gap:6px;align-items:center}
.menub{display:none}
#count{background:var(--gold);color:#2a1020;border-radius:99px;min-width:22px;text-align:center;font-weight:700;font-size:.8rem;padding:1px 6px}
main{max-width:1100px;margin:auto;padding:24px 18px 60px;min-height:70vh}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:20px 0 36px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800}
.hero p{color:var(--mut);max-width:44ch;font-size:1.1rem}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.collage img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px}
.collage img:nth-child(2){transform:translateY(22px)}
.collage img:nth-child(3){border-radius:99px 99px 18px 18px}
.btn{display:inline-block;background:var(--btn);color:var(--btnt);border:0;border-radius:99px;padding:11px 20px;font:700 1rem Figtree,sans-serif;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
h2{font-size:clamp(1.7rem,4vw,2.4rem);margin:34px 0 14px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cat{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1;text-decoration:none;color:#fff;display:flex;align-items:flex-end}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat span{position:relative;width:100%;padding:28px 14px 12px;font:800 1.2rem Fraunces,serif;background:linear-gradient(transparent,rgba(40,8,30,.82))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover}
.card div{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.15rem}
.card p{margin:0;color:var(--mut);font-size:.92rem}
.price{font-weight:700;font-size:1.1rem}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.card .btn{margin-top:auto}
.about{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.about img{width:100%;border-radius:24px;aspect-ratio:1;object-fit:cover}
.about p{color:var(--mut);max-width:60ch}
.rev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.rev b{display:block}.stars{color:var(--gold);letter-spacing:2px}
form.rf{display:grid;gap:10px;max-width:480px;margin-top:20px}
form.rf input,form.rf textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:40;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none}
#items{flex:1;overflow:auto;display:grid;gap:10px;align-content:start;margin:12px 0}
.ci{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.ci img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.ci small{color:var(--mut);display:block}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}
footer{background:var(--pink);padding:30px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.fi{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px}
.fi h3{font-size:1.05rem;margin-bottom:8px}
.fi a{display:block;text-decoration:none;padding:2px 0}
.fi a:hover{text-decoration:underline}
.copy{max-width:1100px;margin:22px auto 0;border-top:1px solid var(--line);padding-top:14px;color:var(--mut);font-size:.9rem}
@media(max-width:820px){.hero,.about{grid-template-columns:1fr}.menub{display:flex}
nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 18px;flex-direction:column}
nav.open{display:flex}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#home">Shop with Unimaj</a>
<nav id="nav" aria-label="Main">
<a href="#home">Home</a><a href="#jewelry">Jewelry</a><a href="#clothes">Clothes</a><a href="#bags">Bags</a><a href="#shoes">Shoes</a><a href="#skincare">Skincare</a><a href="#about">About us</a><a href="#reviews">Reviews</a>
</nav>
<button class="cartb" id="cartBtn" aria-label="Open cart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg><span id="count">0</span></button>
<button class="menub" id="menuBtn" aria-label="Menu" aria-expanded="false">Menu</button>
</div></header>
<main id="app"></main>
<aside id="drawer" aria-label="Cart">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Your cart</h2><button class="cartb" id="closeCart" aria-label="Close cart">Close</button></div>
<div id="items"></div>
<div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin-bottom:10px"><span>Total</span><span id="total"></span></div>
<button class="btn" id="checkout">Checkout</button>
</aside>
<div id="toast" role="status"></div>
<footer>
<div class="fi">
<div><h3>Shop with Unimaj</h3><p style="margin:0">Jewelry, clothes, bags, shoes and skincare in one place.</p></div>
<div><h3>Shop</h3><a href="#jewelry">Jewelry</a><a href="#clothes">Clothes</a><a href="#bags">Bags</a><a href="#shoes">Shoes</a><a href="#skincare">Skincare</a></div>
<div><h3>Company</h3><a href="#home">Home</a><a href="#about">About us</a><a href="#reviews">Reviews</a></div>
</div>

{id:"b2",c:"bags",n:"Pink bow tote with pouch",d:"Bow-print tote and matching zip pouch.",p:14500,img:5},
{id:"s1",c:"shoes",n:"Bow platform loafers",d:"Glossy black with a thick grip sole.",p:18000,img:7,o:["Size 37","Size 38","Size 39","Size 40","Size 41"]},
{id:"k1",c:"skincare",n:"Mud mask sachets",d:"Single-use masks, 3 types.",p:1500,img:3,o:["Dead Sea mud","Vitamin C","Cucumber"]},
{id:"k2",c:"skincare",n:"Star acne patches",d:"Cover blemishes overnight.",p:2500,img:6,o:["Purple","Pink","Navy","Yellow","Green","Teal"]}];
const $=s=>document.querySelector(s),fmt=n=>"₦"+n.toLocaleString("en-NG");
let cart=[],reviews=[
{n:"Amaka",s:5,t:"The ring set is bigger than I expected. Every piece is wearable."},
{n:"Tolu",s:5,t:"Got the polo in two colours. Fits well and the fabric is soft."},
{n:"Chidera",s:4,t:"Loved the pink tote. Fits my laptop and the pouch is a bonus."}];
try{cart=JSON.parse(localStorage.getItem("unimaj-cart")||"[]");reviews=JSON.parse(localStorage.getItem("unimaj-rev")||"null")||reviews}catch(e){}
const save=()=>{try{localStorage.setItem("unimaj-cart",JSON.stringify(cart));localStorage.setItem("unimaj-rev",JSON.stringify(reviews))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(p){return `<article class="card"><img src="${IMG[p.img]}" alt="${esc(p.n)}"><div><h3>${p.n}</h3><p>${p.d}</p>${p.o?`<select id="o-${p.id}" aria-label="Option">${p.o.map(x=>`<option>${x}</option>`).join("")}</select>`:""}<span class="price">${fmt(p.p)}</span><button class="btn" data-add="${p.id}">Add to cart</button></div></article>`}
const views={
home(){return `<section class="hero"><div><h1>Shop with Unimaj</h1><p>Rings, tops, totes, loafers and face masks, picked for everyday style. Add what you like and check out from your cart.</p><a class="btn" href="#bags">Shop bags</a> <a class="btn alt" href="#about">About us</a></div><div class="collage"><img src="${IMG[4]}" alt="Tote bags"><img src="${IMG[2]}" alt="Polo tops"><img src="${IMG[7]}" alt="Bow loafers"></div></section>
<h2>Shop by category</h2><div class="cats">${Object.entries(CATS).map(([k,c])=>`<a class="cat" href="#${k}"><img src="${IMG[c.img]}" alt=""><span>${c.t}</span></a>`).join("")}</div>
<h2>New in</h2><div class="grid">${P.slice(0,6).map(card).join("")}</div>`},
about(){return `<div class="about"><div><h1>About us</h1><p>Shop with Unimaj is a small online shop for everyday style. We sell jewelry, clothes, bags, shoes and skincare, all in one cart.</p><p>Every product on the site is something we would wear or use ourselves. Pick your colour or size, add it to your cart and we take it from there.</p><a class="btn" href="#home">Start shopping</a></div><img src="${IMG[5]}" alt="Pink bow tote bag with pouch"></div>`},
reviews(){return `<h1>Reviews</h1><div class="grid" id="rl" style="margin-top:16px">${reviews.map(r=>`<div class="rev"><span class="stars" aria-label="${r.s} out of 5">${"★".repeat(r.s)}${"☆".repeat(5-r.s)}</span><p>${esc(r.t)}</p><b>${esc(r.n)}</b></div>`).join("")}</div>
<h2>Leave a review</h2><form class="rf" id="rf"><input name="n" placeholder="Your name" required><select name="s" aria-label="Rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><textarea name="t" rows="3" placeholder="What did you buy and how was it?" required></textarea><button class="btn">Post review</button></form>`}};
function route(){const h=(location.hash||"#home").slice(1);let html;
if(CATS[h]){const c=CATS[h];html=`<h1>${c.t}</h1><p style="color:var(--mut)">${c.d}</p><div class="grid" style="margin-top:16px">${P.filter(p=>p.c===h).map(card).join("")}</div>`}
else html=(views[h]||views.home)();
$("#app").innerHTML=html;document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));
$("#nav").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");window.scrollTo(0,0);document.title=(CATS[h]?CATS[h].t+" | ":"")+"Shop with Unimaj";
const rf=$("#rf");if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf);reviews.unshift({n:f.get("n"),s:+f.get("s"),t:f.get("t")});save();route();toast("Review posted")}}
function render(){const n=cart.reduce((a,i)=>a+i.q,0);$("#count").textContent=n;
$("#items").innerHTML=cart.length?cart.map((i,k)=>{const p=P.find(x=>x.id===i.id);return `<div class="ci"><img src="${IMG[p.img]}" alt=""><div>${p.n}<small>${i.o?esc(i.o)+" · ":""}${fmt(p.p)}</small></div><div class="q"><button data-q="${k}" data-d="-1" aria-label="Remove one">−</button> ${i.q} <button data-q="${k}" data-d="1" aria-label="Add one">+</button></div></div>`}).join(""):"<p>Your cart is empty. Add something from the shop.</p>";
$("#total").textContent=fmt(cart.reduce((a,i)=>a+i.q*P.find(x=>x.id===i.id).p,0));save()}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}
document.addEventListener("click",e=>{const a=e.target.closest("[data-add]");
if(a){const id=a.dataset.add,s=$("#o-"+id),o=s?s.value:"";const f=cart.find(i=>i.id===id&&i.o===o);f?f.q++:cart.push({id,o,q:1});render();toast("Added to cart");return}
const q=e.target.closest("[data-q]");if(q){const i=cart[+q.dataset.q];i.q+=+q.dataset.d;if(i.q<1)cart.splice(+q.dataset.q,1);render()}});
$("#cartBtn").onclick=()=>$("#drawer").classList.add("open");
$("#closeCart").onclick=()=>$("#drawer").classList.remove("open");
$("#menuBtn").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)};
$("#checkout").onclick=()=>toast(cart.length?"Checkout isn't connected yet":"Your cart is empty");
$("#yr").textContent=new Date().getFullYear();
addEventListener("hashchange",route);route();render();
</script>
</body>
</html>
